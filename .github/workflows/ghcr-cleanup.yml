name: GHCR Cleanup

on:
  schedule:
    # Weekly, Sundays 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Prune old container versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ghcr-cleanup-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the 20 most recent tagged versions; delete older tagged ones.
          keep-n-tagged: 20
          # Delete untagged manifests older than 14 days. Multi-arch children
          # referenced by a kept manifest list are preserved automatically.
          older-than: 14 days
          delete-untagged: true
