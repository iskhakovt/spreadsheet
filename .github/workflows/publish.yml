name: Publish

on:
  workflow_call:
  workflow_dispatch:

# Deny-by-default; the docker job grants what it needs.
permissions: {}

jobs:
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      cancel-in-progress: false
    # Keep in sync with the calling job in ci.yml.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: version
        run: |
          set -euo pipefail
          echo "version=$(pipx run dunamai==1.26.1 from any --style semver)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          bake-target: app
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      # binfmt_misc + QEMU for arm64-on-amd64 emulation. ubuntu-latest does
      # not pre-register QEMU, and setup-buildx-action does not either.
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: app
          push: true
          set: |
            app.args.VERSION=${{ steps.version.outputs.version }}
