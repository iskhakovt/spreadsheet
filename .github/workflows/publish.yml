name: Publish

on:
  workflow_call:
  workflow_dispatch:

# Deny-by-default; the docker job grants what it needs.
permissions: {}

jobs:
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # Generous ceiling — the arm64 leg builds under QEMU emulation, which
    # is several times slower than native. Catches a genuine hang without
    # false-positiving a cold-cache emulated build.
    timeout-minutes: 60
    concurrency:
      group: publish-image
      cancel-in-progress: false
    # Keep in sync with the calling job in ci.yml.
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        run: |
          set -euo pipefail
          echo "version=$(pipx run dunamai==1.26.1 from any --style semver)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          bake-target: app
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      # binfmt_misc + QEMU for arm64-on-amd64 emulation. ubuntu-latest does
      # not pre-register QEMU, and setup-buildx-action does not either.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          targets: app
          push: true
          set: |
            app.args.VERSION=${{ steps.version.outputs.version }}

  # Vulnerability + secret scan of the released image. SARIF → code-scanning
  # (Security tab); findings don't block the release — triage async, ship
  # a patch for anything acute. Replaces the unsigned buildkit SBOM/
  # provenance attestations we used to attach: those were unverifiable
  # (anyone with packages:write could forge them), whereas this surfaces
  # actionable CVEs — plus any secret accidentally baked into an image
  # layer — in what we actually ship. `severity: HIGH,CRITICAL` filters
  # both kinds, so a sub-HIGH secret would be dropped; real leaked
  # credentials still land because Trivy's secret rules are nearly all
  # CRITICAL. `ignore-unfixed` is vuln-only (secrets have no fixed version).
  #
  # amd64-only: most findings overlap with arm64, but arch-specific binaries
  # (Node native, libssl variants) can carry arm64-only CVEs we miss.
  # Acceptable gap at this scale.
  scan:
    name: Trivy scan
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      # Upload SARIF to code-scanning. Without `security-events: write`,
      # the action fails on the upload itself. Without `actions: read`,
      # the action fails earlier when it calls GET /actions/runs/{id} to
      # enrich the SARIF with run metadata. Reusable-workflow permissions
      # are capped by the caller — keep release.yml's publish job in sync.
      security-events: write
      actions: read
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          # Explicit so a future trivy-action bump that changes the
          # default doesn't silently flip behavior.
          scanners: vuln,secret
          # `ignore-unfixed` hides CVEs with no upstream patch — exactly
          # the signal for base-image-swap decisions, so revisit then.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # Key rotates daily + release cadence means no cross-release
          # cache hits anyway, so caching only buys log noise.
          cache: false

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        # Run even if Trivy itself errored (e.g. DB download flake) so we
        # don't lose partial results. The upload action no-ops on a missing
        # file but logs a clear message.
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
