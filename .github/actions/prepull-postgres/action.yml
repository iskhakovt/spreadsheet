name: Pre-pull Postgres image
description: >
  Pull the Postgres testcontainer image with retries. public.ecr.aws
  intermittently 404s under load, and testcontainers pulls inline at container
  start with no retry — without this a single registry blip fails the whole job
  (CI runs with retries: 0). Requires the repo to be checked out first.

inputs:
  image:
    description: >
      Image reference to pull. Must match the tag hardcoded in
      packages/server/src/test/integration-setup.ts and e2e/global-setup.ts.
    required: false
    default: public.ecr.aws/docker/library/postgres:18

runs:
  using: composite
  steps:
    # Bind the input via env rather than interpolating ${{ }} into the script
    # body — expression substitution happens before the shell runs, so a value
    # with shell metacharacters could break out. Env-binding passes it as data.
    - shell: bash
      env:
        IMAGE_REF: ${{ inputs.image }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if docker pull "$IMAGE_REF"; then exit 0; fi
          if [ "$attempt" -lt 3 ]; then
            echo "::warning::pull attempt $attempt for $IMAGE_REF failed; retrying in $((attempt * 5))s"
            sleep "$((attempt * 5))"
          fi
        done
        echo "::error::failed to pull $IMAGE_REF after 3 attempts"
        exit 1
